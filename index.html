<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendero de materia — Libro abierto</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="book-container">
    <svg
      id="book-path-svg"
      viewBox="0 0 900 540"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="bookTitleA11y">

      <title id="bookTitleA11y">Sendero de la materia: Lectura, Videos, Mapas Conceptuales, Examen</title>

      <defs>
        <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#FBF6E8"/>
          <stop offset="60%" stop-color="#F1E9D2"/>
          <stop offset="100%" stop-color="#E4D8B8"/>
        </linearGradient>

        <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="#0B3A2C"/>
          <stop offset="100%" stop-color="#0A5744"/>
        </linearGradient>

        <linearGradient id="coverGradientR" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="#0A5744"/>
          <stop offset="100%" stop-color="#0B3A2C"/>
        </linearGradient>

        <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#000000" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="goldPill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="#E4AC21"/>
          <stop offset="100%" stop-color="#B9860F"/>
        </linearGradient>

        <!-- textura de papel (grano sutil) -->
        <filter id="paperTexture" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5" result="noise"/>
          <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.12 0"/>
        </filter>

        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#E4AC21" flood-opacity="0.65"/>
        </filter>

        <clipPath id="leftPageClip"><rect x="50" y="20" width="395" height="500" rx="14"/></clipPath>
        <clipPath id="rightPageClip"><rect x="455" y="20" width="395" height="500" rx="14"/></clipPath>
      </defs>

      <!-- ============================================================ -->
      <!-- TAPAS / CANTOS DEL LIBRO (referencia a la tarjeta de materia) -->
      <!-- ============================================================ -->
      <rect x="10" y="10" width="40" height="520" rx="8" fill="url(#coverGradient)" stroke="url(#goldPill)" stroke-width="2"/>
      <rect x="850" y="10" width="40" height="520" rx="8" fill="url(#coverGradientR)" stroke="url(#goldPill)" stroke-width="2"/>

      <!-- ============================================================ -->
      <!-- PÁGINAS                                                        -->
      <!-- ============================================================ -->
      <g filter="url(#softShadow)">
        <rect x="50" y="20" width="395" height="500" rx="14" fill="url(#paperGradient)"/>
        <rect x="455" y="20" width="395" height="500" rx="14" fill="url(#paperGradient)"/>
      </g>
      <g clip-path="url(#leftPageClip)">
        <rect x="50" y="20" width="395" height="500" filter="url(#paperTexture)"/>
      </g>
      <g clip-path="url(#rightPageClip)">
        <rect x="455" y="20" width="395" height="500" filter="url(#paperTexture)"/>
      </g>
      <!-- sombra del pliegue central -->
      <rect x="415" y="20" width="70" height="500" fill="url(#spineShadow)"/>

      <!-- ============================================================ -->
      <!-- SENDERO: se dibuja/actualiza desde script.js (renderPath)      -->
      <!-- ============================================================ -->
      <g id="path-track"></g>
      <g id="path-arrows"></g>
      <g id="path-stations"></g>

    </svg>
  </div>

  <script src="script.js"></script>
</body>
</html>
